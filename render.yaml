services:
  - type: web
    name: merkato-bekan25
    runtime: docker
    plan: free
    region: frankfurt
    branch: feature/merkato-professional-marketplace
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__PostgreSql
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: https://merkato-bekan25.onrender.com
      - key: Jwt__Audience
        value: merkato-web
      - key: Jwt__ExpiryMinutes
        value: "30"
      - key: MERKATO_ALLOWED_ORIGINS
        value: https://merkato-bekan25.onrender.com
      - key: MERKATO_APPLY_MIGRATIONS
        value: "true"
