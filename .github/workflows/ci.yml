name: MERKATO CI

on:
  push:
    branches:
      - main
      - feature/merkato-professional-marketplace
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Angular application
        working-directory: frontend
        run: npm run build

  backend:
    name: ASP.NET Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore backend/Merkato.sln
      - name: Build
        run: dotnet build backend/Merkato.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/Merkato.sln --configuration Release --no-build

  containers:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file backend/Dockerfile --tag merkato-api:ci .
      - name: Build web image
        run: docker build --file frontend/Dockerfile --tag merkato-web:ci .
      - name: Validate Compose deployment configuration
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
          JWT_KEY: ci-only-key-with-more-than-thirty-two-random-characters
          JWT_ISSUER: https://api.merkato.test
          JWT_AUDIENCE: https://merkato.test
          MERKATO_ALLOWED_ORIGINS: https://merkato.test
          MERKATO_DOMAIN: merkato.test
        run: docker compose config --quiet
