name: MERKATO CI

on:
  push:
    branches:
      - main
      - feature/merkato-professional-marketplace
      - feature/auth-hardening-without-otp
      - feature/merkato-four-growth-engines
  pull_request:
    branches:
      - main
      - feature/merkato-professional-marketplace

permissions:
  contents: read

concurrency:
  group: merkato-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Angular build and flow contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build Angular application
        working-directory: frontend
        run: npm run build

  backend:
    name: ASP.NET Core 10 and PostgreSQL migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merkato_ci -d merkato_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__PostgreSql: Host=localhost;Port=5432;Database=merkato_ci;Username=merkato_ci;Password=ci-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore backend/Merkato.Api/Merkato.Api.csproj
          dotnet restore backend/Merkato.Tests/Merkato.Tests.csproj
      - name: Build
        run: |
          dotnet build backend/Merkato.Api/Merkato.Api.csproj --configuration Release --no-restore
          dotnet build backend/Merkato.Tests/Merkato.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/Merkato.Tests/Merkato.Tests.csproj --configuration Release --no-build
      - name: Verify EF Core model snapshot and apply migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet ef migrations has-pending-model-changes --project backend/Merkato.Infrastructure --startup-project backend/Merkato.Api
          dotnet ef database update --project backend/Merkato.Infrastructure --startup-project backend/Merkato.Api

  containers:
    name: Container image, PostgreSQL and smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merkato_ci -d merkato_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build combined API and storefront image
        run: docker build --file backend/Dockerfile --tag merkato:ci .
      - name: Run container smoke test against PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm --force merkato-smoke >/dev/null 2>&1 || true
            rm -f /tmp/merkato-dp.key /tmp/merkato-dp.crt /tmp/merkato-dp.pfx
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -keyout /tmp/merkato-dp.key -out /tmp/merkato-dp.crt -days 2 -nodes -subj "/CN=merkato-ci-dataprotection"
          openssl pkcs12 -export -out /tmp/merkato-dp.pfx -inkey /tmp/merkato-dp.key -in /tmp/merkato-dp.crt -passout pass:ci-dp-password
          DP_CERT_BASE64="$(base64 -w0 /tmp/merkato-dp.pfx)"
          docker run --detach --network host --name merkato-smoke \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__PostgreSql="Host=127.0.0.1;Port=5432;Database=merkato_ci;Username=merkato_ci;Password=ci-password-not-for-production" \
            -e Jwt__Key="ci-only-key-with-more-than-thirty-two-random-characters" \
            -e Jwt__Issuer="https://api.merkato.test" \
            -e Jwt__Audience="https://merkato.test" \
            -e MERKATO_ALLOWED_ORIGINS="https://merkato.test" \
            -e MERKATO_DP_CERT_PFX_BASE64="$DP_CERT_BASE64" \
            -e MERKATO_DP_CERT_PASSWORD="ci-dp-password" \
            -e MERKATO_APPLY_MIGRATIONS="true" merkato:ci

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker logs merkato-smoke
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/

          key_count="$(docker run --rm --network host postgres:16 psql "postgresql://merkato_ci:ci-password-not-for-production@127.0.0.1:5432/merkato_ci" -Atc 'SELECT count(*) FROM "DataProtectionKeys";')"
          if [ "$key_count" -lt 1 ]; then
            echo "Expected an initialized Data Protection key in PostgreSQL, found: $key_count"
            docker logs merkato-smoke
            exit 1
          fi

          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"phoneNumber":"0911000001","fullName":"CI Session Buyer","role":"BUYER","pin":"123456"}' >/tmp/merkato-register.json
          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"phoneNumber":"0911000001","pin":"123456"}' >/tmp/merkato-login.json
          token="$(jq -r '.token // empty' /tmp/merkato-login.json)"
          if [ -z "$token" ]; then
            echo "Login did not return a JWT token."
            cat /tmp/merkato-login.json
            exit 1
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/auth/me

          docker restart merkato-smoke
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker logs merkato-smoke
            exit 1
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/auth/me
          docker logs merkato-smoke
      - name: Validate Compose deployment configuration
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
          JWT_KEY: ci-only-key-with-more-than-thirty-two-random-characters
          JWT_ISSUER: https://api.merkato.test
          JWT_AUDIENCE: https://merkato.test
          MERKATO_ALLOWED_ORIGINS: https://merkato.test
          MERKATO_DOMAIN: merkato.test
        run: docker compose config --quiet

  dependency-audit:
    name: High and critical dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit npm dependencies (including development tooling)
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET solution with NuGet auditing enabled
        run: dotnet restore backend/Merkato.sln -p:NuGetAudit=true -p:NuGetAuditLevel=high
      - name: Report NuGet vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list backend/Merkato.sln package --vulnerable --include-transitive | tee /tmp/merkato-nuget-audit.txt
          if grep -Eiq '(^|[[:space:]])(High|Critical)([[:space:]]|$)' /tmp/merkato-nuget-audit.txt; then
            echo "High or critical NuGet vulnerabilities were found."
            exit 1
          fi
