name: MERKATO CI

on:
  push:
    branches:
      - main
      - feature/merkato-professional-marketplace
      - feature/auth-hardening-without-otp
  pull_request:
    branches:
      - main
      - feature/merkato-professional-marketplace

permissions:
  contents: read

jobs:
  frontend:
    name: Angular build and flow contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build Angular application
        working-directory: frontend
        run: npm run build

  backend:
    name: ASP.NET Core 10 and PostgreSQL migration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merkato_ci -d merkato_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__PostgreSql: Host=localhost;Port=5432;Database=merkato_ci;Username=merkato_ci;Password=ci-password-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/Merkato.sln
      - name: Build
        run: dotnet build backend/Merkato.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/Merkato.sln --configuration Release --no-build
      - name: Apply all EF Core migrations to PostgreSQL 16
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet ef database update --project backend/Merkato.Infrastructure --startup-project backend/Merkato.Api

  containers:
    name: Container image, PostgreSQL and smoke validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merkato_ci -d merkato_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build combined API and storefront image
        run: docker build --file backend/Dockerfile --tag merkato:ci .
      - name: Run container smoke test against PostgreSQL
        run: |
          docker run --detach --network host --name merkato-smoke \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__PostgreSql="Host=127.0.0.1;Port=5432;Database=merkato_ci;Username=merkato_ci;Password=ci-password-not-for-production" \
            -e Jwt__Key="ci-only-key-with-more-than-thirty-two-random-characters" \
            -e Jwt__Issuer="https://api.merkato.test" \
            -e Jwt__Audience="https://merkato.test" \
            -e MERKATO_ALLOWED_ORIGINS="https://merkato.test" \
            -e MERKATO_APPLY_MIGRATIONS="true" merkato:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              break
            fi
            sleep 3
          done
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          docker logs merkato-smoke
          docker rm --force merkato-smoke
      - name: Validate Compose deployment configuration
        env:
          POSTGRES_DB: merkato_ci
          POSTGRES_USER: merkato_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
          JWT_KEY: ci-only-key-with-more-than-thirty-two-random-characters
          JWT_ISSUER: https://api.merkato.test
          JWT_AUDIENCE: https://merkato.test
          MERKATO_ALLOWED_ORIGINS: https://merkato.test
          MERKATO_DOMAIN: merkato.test
        run: docker compose config --quiet
