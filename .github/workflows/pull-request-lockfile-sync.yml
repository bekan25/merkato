name: Pull request npm lockfile sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-verify-frontend:
    if: startsWith(github.head_ref, 'chore/angular-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "chore(frontend): regenerate npm lockfile"
            git push origin "${{ github.event.pull_request.head.ref }}"
          fi
      - name: Verify clean install
        working-directory: frontend
        run: npm ci
      - name: Audit high and critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run frontend contract tests
        working-directory: frontend
        run: npm test
      - name: Build Angular production bundle
        working-directory: frontend
        run: npm run build
