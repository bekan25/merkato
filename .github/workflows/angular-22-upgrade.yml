name: Angular 22 lockfile refresh

on:
  push:
    branches:
      - chore/angular-22-security-upgrade
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/angular-22-security-upgrade
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
          else
            git commit -m "chore(frontend): regenerate Angular 22 lockfile"
            git push origin chore/angular-22-security-upgrade
          fi
      - name: Clean install from committed lockfile
        working-directory: frontend
        run: npm ci
      - name: Dependency security audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Frontend contract tests
        working-directory: frontend
        run: npm test
      - name: Angular production build
        working-directory: frontend
        run: npm run build
