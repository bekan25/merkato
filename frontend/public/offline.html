<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B3D2E">
  <title>You're offline · MERKATO</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f7f2;color:#173b2c;font:16px system-ui,sans-serif}
    main{width:min(440px,100%);padding:34px;border:1px solid #e3e9df;border-radius:24px;background:#fff;box-shadow:0 18px 60px #123b2f12;text-align:center}
    img{width:72px;height:72px}h1{margin:20px 0 8px;font-size:28px}p{color:#68776c;line-height:1.65;font-size:14px}
    button{margin-top:18px;padding:13px 22px;border:0;border-radius:12px;background:#0b3d2e;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main>
  <img src="/icons/merkato-icon.svg" alt="MERKATO">
  <h1>You're offline</h1>
  <p>MERKATO needs an internet connection to load live products, account details and orders. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main></body>
</html>
