<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MERKATO — Ethiopia's Digital Marketplace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B3D2E">
  <meta name="description" content="Discover products from trusted Ethiopian merchants on MERKATO.">
  <meta name="application-name" content="MERKATO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MERKATO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/merkato-icon.svg">
  <link rel="apple-touch-icon" href="/icons/merkato-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    #merkato-install-button{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1000;padding:12px 17px;border:1px solid #dcae61;border-radius:999px;background:#0b3d2e;color:#fff;font:700 12px system-ui,sans-serif;box-shadow:0 8px 28px #0b3d2e35;cursor:pointer}
    #merkato-install-button[hidden]{display:none}
    @media(max-width:760px){#merkato-install-button{right:12px;bottom:calc(82px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <app-root></app-root>
  <button id="merkato-install-button" type="button" aria-label="Install MERKATO app">Install MERKATO</button>
  <script src="/pwa-install.js" defer></script>
</body>
</html>
